name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer to publish (for example 2.0.2)
        required: true
        type: string
      channel:
        description: npm dist-tag and GitHub Release channel
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  release:
    name: Publish npm and GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release
        uses: ./.github/actions/release
        with:
          version: ${{ inputs.version }}
          channel: ${{ inputs.channel }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Needed only to create the packages. Remove this environment secret after
          # configuring release.yml as the npm Trusted Publisher for both packages.
          bootstrap_npm_token: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

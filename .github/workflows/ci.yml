name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'fix*'
      - 'feat*'
      - 'feature*'
  pull_request:
    branches: [main]
  # Appelé par release.yml : une release ne part que si lint + tests + build sont verts.
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and check formatting
        run: yarn lint

      - name: Check release tooling and changelog
        run: |
          yarn test:scripts
          yarn changelog:check

  compat:
    name: Nuxt UI ${{ matrix.nuxt-ui }} · TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported host range: the `@nuxt/ui` peer floor (4.10) and the current minor (4.12);
        # the `typescript` peer accepts ^5 || ^6 || ^7, and vue-tsc runs on 5.9 and 6.0.
        nuxt-ui: ['4.10', '4.12']
        typescript: ['5.9', '6.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Nuxt UI ${{ matrix.nuxt-ui }} and TypeScript ${{ matrix.typescript }}
        env:
          NUXT_UI_RANGE: ~${{ matrix.nuxt-ui }}.0
          TYPESCRIPT_RANGE: ~${{ matrix.typescript }}.0
        run: |
          yarn add --dev --ignore-scripts "@nuxt/ui@${NUXT_UI_RANGE}" "typescript@${TYPESCRIPT_RANGE}"
          node -e "
            const fs = require('node:fs')
            const ui = JSON.parse(fs.readFileSync('node_modules/@nuxt/ui/package.json', 'utf8')).version
            const ts = require('typescript').version
            console.log('Nuxt UI', ui, '· TypeScript', ts)
            if (!ui.startsWith(process.argv[1] + '.') || !ts.startsWith(process.argv[2] + '.')) process.exit(1)
          " "${{ matrix.nuxt-ui }}" "${{ matrix.typescript }}"

      - name: Type-check and build
        run: yarn build

      - name: Run unit tests
        run: yarn test

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      # Strict CSP and read-only recipe (`yarn test:browser` without its library build step).
      - name: Run the browser recipe against this Nuxt UI
        run: |
          yarn vite build --config tests/browser/vite.config.ts
          yarn playwright test --config tests/browser/playwright.config.ts

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recipe-nuxt-ui-${{ matrix.nuxt-ui }}-ts-${{ matrix.typescript }}
          path: tests/browser/.results
          retention-days: 7

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FicSysFR/jsonforms_builder
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          disable_search: true
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Install and build MCP package
        run: |
          yarn --cwd mcp install --frozen-lockfile
          yarn --cwd mcp build

      - name: Build documentation
        run: yarn docs:build

      - name: Build and audit npm tarballs
        run: yarn package:check

name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'fix*'
      - 'feat*'
      - 'feature*'
  pull_request:
    branches: [main]
  # Appelé par release.yml : une release ne part que si lint + tests + build sont verts.
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and check formatting
        run: yarn lint

      - name: Check release tooling and changelog
        run: |
          yarn test:scripts
          yarn changelog:check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FicSysFR/jsonforms_builder
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Install and build MCP package
        run: |
          yarn --cwd mcp install --frozen-lockfile
          yarn --cwd mcp build

      - name: Build documentation
        run: yarn docs:build

      - name: Build and audit npm tarballs
        run: yarn package:check

name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
      - 'fix*'
      - 'feat*'
      - 'feature*'
  pull_request:
    branches: [main]
  # Appelé par release.yml : une release ne part que si lint + tests + build sont verts.
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and check formatting
        run: yarn lint

      - name: Check release tooling and changelog
        run: |
          yarn test:scripts
          yarn changelog:check

  typescript:
    name: TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The `typescript` peer accepts ^5 || ^6 || ^7: type-check and build the library and its
        # declarations under each supported major that the toolchain (vue-tsc) runs on.
        typescript: ['5.9', '6.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install TypeScript ${{ matrix.typescript }}
        env:
          TYPESCRIPT_RANGE: ~${{ matrix.typescript }}.0
        run: |
          yarn add --dev --ignore-scripts "typescript@${TYPESCRIPT_RANGE}"
          node -e "const v=require('typescript').version;console.log('TypeScript',v);if(!v.startsWith(process.argv[1]+'.'))process.exit(1)" "${{ matrix.typescript }}"

      - name: Type-check and build
        run: yarn build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FicSysFR/jsonforms_builder
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          disable_search: true
          fail_ci_if_error: true

  browser:
    name: Browser recipe (strict CSP, read-only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Build the library and run the recipe
        run: yarn test:browser

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-recipe-results
          path: tests/browser/.results
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Install and build MCP package
        run: |
          yarn --cwd mcp install --frozen-lockfile
          yarn --cwd mcp build

      - name: Build documentation
        run: yarn docs:build

      - name: Build and audit npm tarballs
        run: yarn package:check

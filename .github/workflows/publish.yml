name: Publish

# Publie sur npm quand une Release GitHub est publiée à la main (`make release` /
# CLI gh / UI GitHub). Les Releases créées par le workflow Release
# (github-actions[bot]) sont ignorées : ce workflow-là publie déjà sur npm.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.release.author.login != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Le commit courant de main peut déjà avoir avancé : on publie le contenu du tag.
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check version matches the release tag
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          if [ "${VERSION}" != "${TAG#v}" ]; then
            echo "package.json version (${VERSION}) does not match release tag (${TAG})" >&2
            exit 1
          fi

      - name: Run tests
        run: yarn test

      - name: Build project
        run: yarn build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm — skipping library publish."
          else
            echo "Publishing ${NAME}@${VERSION} with dist-tag ${DIST_TAG}"
            npm publish --access public --tag "${DIST_TAG}"
          fi

      - name: Publish MCP package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          node scripts/publish-mcp.mjs --tag "${DIST_TAG}"

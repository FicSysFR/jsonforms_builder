name: Release
description: Build audited npm tarballs, publish them and create the GitHub Release

inputs:
  version:
    description: Exact SemVer to publish
    required: true
  channel:
    description: npm dist-tag (latest or next)
    required: true
  github_token:
    description: GitHub token used for the release commit, tag and Release
    required: true
  bootstrap_npm_token:
    description: One-use npm token; empty after Trusted Publishing is configured
    required: false
    default: ''
  node_version:
    description: Node.js version used to build and publish
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ inputs.github_token }}

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
        registry-url: https://registry.npmjs.org
        package-manager-cache: false

    - name: Validate release inputs and npm CLI
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        node scripts/release-state.mjs prepare \
          --version "${RELEASE_VERSION}" --channel "${RELEASE_CHANNEL}" --root . \
          >/dev/null
        git restore package.json mcp/package.json
        NPM_VERSION=$(npm --version)
        MINIMUM=11.5.1
        if [ "$(printf '%s\n' "${MINIMUM}" "${NPM_VERSION}" | sort -V | head -n1)" != "${MINIMUM}" ]; then
          echo "npm ${MINIMUM}+ is required for Trusted Publishing (found ${NPM_VERSION})" >&2
          exit 1
        fi

    - name: Configure Git
      shell: bash
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"

    - name: Resolve release state
      id: state
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        git fetch origin --tags --force
        if git show-ref --verify --quiet "refs/tags/${RELEASE_VERSION}"; then
          git checkout --detach "refs/tags/${RELEASE_VERSION}"
          node scripts/release-state.mjs verify \
            --version "${RELEASE_VERSION}" --channel "${RELEASE_CHANNEL}"
          echo "reuse=true" >> "${GITHUB_OUTPUT}"
          echo "Reusing existing tag ${RELEASE_VERSION} at $(git rev-parse HEAD)"
        else
          node scripts/release-state.mjs prepare \
            --version "${RELEASE_VERSION}" --channel "${RELEASE_CHANNEL}"
          git add package.json mcp/package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${RELEASE_VERSION}"
          fi
          echo "reuse=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Validate release and build tarballs
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        node scripts/release-state.mjs verify \
          --version "${RELEASE_VERSION}" --channel "${RELEASE_CHANNEL}"
        yarn lint
        yarn typecheck
        yarn test:coverage
        yarn test:scripts
        yarn docs:build
        yarn changelog:check
        yarn package:check
        echo "VALIDATED_HEAD=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

    - name: Push release commit and tag
      if: steps.state.outputs.reuse != 'true'
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          git fetch origin main
          git rebase origin/main

          if [ "$(git rev-parse HEAD)" != "${VALIDATED_HEAD}" ]; then
            echo "main advanced; validating the rebased release (${attempt}/3)"
            yarn install --frozen-lockfile
            node scripts/release-state.mjs verify \
              --version "${RELEASE_VERSION}" --channel "${RELEASE_CHANNEL}"
            yarn lint
            yarn typecheck
            yarn test:coverage
            yarn test:scripts
            yarn docs:build
            yarn changelog:check
            yarn package:check
            VALIDATED_HEAD=$(git rev-parse HEAD)
          fi

          git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true
          git tag -a "${RELEASE_VERSION}" -m "Release ${RELEASE_VERSION}"
          if git push --atomic origin HEAD:refs/heads/main "refs/tags/${RELEASE_VERSION}"; then
            exit 0
          fi

          git tag -d "${RELEASE_VERSION}" >/dev/null 2>&1 || true
          if [ "${attempt}" -lt 3 ]; then
            echo "push raced with main; rebasing and retrying (${attempt}/3)"
          fi
        done
        echo "release push failed after three validated attempts" >&2
        exit 1

    - name: Publish or verify npm packages
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.bootstrap_npm_token }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail

        local_integrity() {
          node -e "const fs=require('node:fs');const c=require('node:crypto');const b=fs.readFileSync(process.argv[1]);process.stdout.write('sha512-'+c.createHash('sha512').update(b).digest('base64'))" "$1"
        }

        publish_or_verify() {
          PACKAGE_NAME="$1"
          TARBALL="$2"
          LOCAL_INTEGRITY=$(local_integrity "${TARBALL}")

          if REGISTRY_INTEGRITY=$(npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" dist.integrity 2>/dev/null); then
            if [ "${REGISTRY_INTEGRITY}" != "${LOCAL_INTEGRITY}" ]; then
              echo "${PACKAGE_NAME}@${RELEASE_VERSION} exists with different contents" >&2
              exit 1
            fi
            echo "${PACKAGE_NAME}@${RELEASE_VERSION} already matches the audited tarball"
          else
            npm publish "${TARBALL}" \
              --access public --tag "${RELEASE_CHANNEL}" --provenance
          fi

          REGISTRY_INTEGRITY=$(npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" dist.integrity)
          if [ "${REGISTRY_INTEGRITY}" != "${LOCAL_INTEGRITY}" ]; then
            echo "registry integrity mismatch for ${PACKAGE_NAME}@${RELEASE_VERSION}" >&2
            exit 1
          fi
          TAG_VERSION=$(npm view "${PACKAGE_NAME}@${RELEASE_CHANNEL}" version)
          if [ "${TAG_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "${PACKAGE_NAME}@${RELEASE_CHANNEL} points to ${TAG_VERSION}" >&2
            exit 1
          fi
        }

        LIB_TARBALL=".artifacts/npm/ficsysfr-jsonforms_builder-${RELEASE_VERSION}.tgz"
        MCP_TARBALL=".artifacts/npm/ficsysfr-jsonforms_builder-mcp-${RELEASE_VERSION}.tgz"
        test -f "${LIB_TARBALL}"
        test -f "${MCP_TARBALL}"
        publish_or_verify '@ficsysfr/jsonforms_builder' "${LIB_TARBALL}"
        publish_or_verify '@ficsysfr/jsonforms_builder-mcp' "${MCP_TARBALL}"

    - name: Deprecate legacy npm packages after bootstrap
      if: inputs.bootstrap_npm_token != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.bootstrap_npm_token }}
      run: |
        set -euo pipefail
        npm deprecate '@tacxou/jsonforms_builder@>=2.0.0' \
          'This v2 package is frozen. Use @ficsysfr/jsonforms_builder. Quasar 1.x remains available.'
        npm deprecate '@tacxou/jsonforms_builder-mcp@*' \
          'This package moved to @ficsysfr/jsonforms_builder-mcp.'
        test "$(npm view '@tacxou/jsonforms_builder@2.0.1' deprecated)" = \
          'This v2 package is frozen. Use @ficsysfr/jsonforms_builder. Quasar 1.x remains available.'
        test "$(npm view '@tacxou/jsonforms_builder-mcp@2.0.1' deprecated)" = \
          'This package moved to @ficsysfr/jsonforms_builder-mcp.'

    - name: Generate GitHub Release notes
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
      run: |
        node scripts/build-changelog.mjs --release-notes "${RELEASE_VERSION}" \
          --out "${RUNNER_TEMP}/release-notes.md"

    - name: Create or update GitHub Release
      uses: ncipollo/release-action@v1
      with:
        name: ${{ inputs.version }}
        tag: ${{ inputs.version }}
        bodyFile: ${{ runner.temp }}/release-notes.md
        prerelease: ${{ inputs.channel == 'next' }}
        makeLatest: ${{ inputs.channel == 'latest' }}
        generateReleaseNotes: false
        artifacts: .artifacts/npm/*.tgz,.artifacts/npm/SHA256SUMS.txt
        artifactErrorsFailBuild: true
        allowUpdates: true
        replacesArtifacts: true
        token: ${{ inputs.github_token }}

    - name: Release summary
      shell: bash
      run: |
        {
          echo "### Release ${{ inputs.version }}"
          echo
          echo "- npm channel: ${{ inputs.channel }}"
          echo "- packages: @ficsysfr/jsonforms_builder + @ficsysfr/jsonforms_builder-mcp"
          echo "- authentication: ${{ inputs.bootstrap_npm_token != '' && 'temporary bootstrap token' || 'npm Trusted Publishing (OIDC)' }}"
          echo "- assets: two audited tarballs + SHA256SUMS.txt"
        } >> "${GITHUB_STEP_SUMMARY}"
